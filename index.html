<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus AI — Polytechnic Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #060812;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.09);
    --glass-hover: rgba(255,255,255,0.07);
    --accent: #7c6ff7;
    --accent2: #a78bfa;
    --accent-glow: rgba(124,111,247,0.25);
    --text: #f0eeff;
    --text-muted: rgba(240,238,255,0.45);
    --text-sub: rgba(240,238,255,0.65);
    --danger: #f87171;
    --success: #34d399;
    --input-bg: rgba(255,255,255,0.05);
    --sidebar-w: 260px;
  }

  html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

  /* ── Background ── */
  .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.18; animation: drift 18s ease-in-out infinite alternate; }
  .orb1 { width: 500px; height: 500px; background: #7c6ff7; top: -150px; left: -100px; animation-duration: 20s; }
  .orb2 { width: 400px; height: 400px; background: #3b82f6; bottom: -100px; right: -80px; animation-duration: 24s; animation-delay: -8s; }
  .orb3 { width: 300px; height: 300px; background: #a855f7; top: 40%; left: 50%; animation-duration: 16s; animation-delay: -4s; }
  @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px, 30px) scale(1.08); } }

  /* ── Auth Screens ── */
  .auth-wrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; }
  .auth-card {
    width: 420px; max-width: 95vw; background: rgba(255,255,255,0.04); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 48px 40px 40px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: none; } }

  .auth-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
  .auth-logo-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #7c6ff7, #a78bfa); display: flex; align-items: center; justify-content: center; }
  .auth-logo-icon svg { width: 18px; height: 18px; fill: #fff; }
  .auth-logo-name { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; }
  .auth-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .auth-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.4px; }
  .field input {
    width: 100%; padding: 13px 16px; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px; color: var(--text); font-family: inherit; font-size: 15px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus { border-color: rgba(124,111,247,0.6); box-shadow: 0 0 0 3px rgba(124,111,247,0.12); }
  .err-msg { font-size: 12.5px; color: var(--danger); margin-bottom: 14px; display: none; padding: 10px 14px; background: rgba(248,113,113,0.08); border-radius: 8px; border: 1px solid rgba(248,113,113,0.2); }

  .btn-primary {
    width: 100%; padding: 14px; background: linear-gradient(135deg, #7c6ff7, #a78bfa); border: none; border-radius: 12px;
    color: #fff; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 8px 24px rgba(124,111,247,0.35); transition: opacity 0.2s, transform 0.15s; margin-top: 4px;
  }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .auth-switch { text-align: center; margin-top: 22px; font-size: 13.5px; color: var(--text-muted); }
  .auth-switch a { color: var(--accent2); text-decoration: none; font-weight: 500; cursor: pointer; }
  .auth-switch a:hover { text-decoration: underline; }

  /* ── App Shell ── */
  .app { display: none; position: fixed; inset: 0; z-index: 5; flex-direction: row; }
  .app.visible { display: flex; }

  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: rgba(255,255,255,0.025); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; padding: 20px 14px;
  }
  .sidebar-logo { display: flex; align-items: center; gap: 9px; padding: 4px 6px 20px; border-bottom: 1px solid var(--glass-border); margin-bottom: 16px; }
  .sidebar-logo-icon { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #7c6ff7, #a78bfa); display: flex; align-items: center; justify-content: center; }
  .sidebar-logo-icon svg { width: 15px; height: 15px; fill: #fff; }
  .sidebar-logo-name { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; }

  .btn-new-chat {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 14px; background: rgba(124,111,247,0.2);
    border: 1px solid rgba(124,111,247,0.35); border-radius: 10px; color: var(--accent2); font-family: inherit;
    font-size: 13.5px; font-weight: 500; cursor: pointer; margin-bottom: 18px; transition: all 0.2s;
  }
  .btn-new-chat:hover { background: rgba(124,111,247,0.3); border-color: rgba(124,111,247,0.55); }
  .btn-new-chat svg { width: 14px; height: 14px; }

  .chats-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); font-weight: 500; padding: 0 6px; margin-bottom: 8px; }
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
  .chat-list::-webkit-scrollbar { width: 3px; }
  .chat-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .chat-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 9px; cursor: pointer;
    transition: background 0.15s; position: relative;
  }
  .chat-item:hover { background: var(--glass-hover); }
  .chat-item.active { background: rgba(124,111,247,0.15); }
  .chat-item-text { flex: 1; font-size: 13px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item.active .chat-item-text { color: var(--text); }
  .chat-item-del {
    width: 22px; height: 22px; border-radius: 5px; display: none; align-items: center; justify-content: center;
    background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.2); cursor: pointer; flex-shrink: 0;
  }
  .chat-item:hover .chat-item-del { display: flex; }
  .chat-item-del:hover { background: rgba(248,113,113,0.25); }
  .chat-item-del svg { width: 11px; height: 11px; stroke: var(--danger); fill: none; }

  .sidebar-footer { padding-top: 16px; border-top: 1px solid var(--glass-border); }
  .user-pill { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; }
  .user-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #7c6ff7, #a78bfa);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; flex-shrink: 0;
  }
  .user-info { flex: 1; min-width: 0; }
  .user-email { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logout-btn { font-size: 11px; color: var(--text-muted); cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .logout-btn:hover { color: var(--danger); }

  /* ── Main Chat Area ── */
  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header {
    padding: 18px 28px; border-bottom: 1px solid var(--glass-border); background: rgba(255,255,255,0.015);
    backdrop-filter: blur(10px); display: flex; align-items: center; gap: 12px;
  }
  .chat-header-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 600; }
  .chat-header-sub { font-size: 12px; color: var(--text-muted); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px rgba(52,211,153,0.6); flex-shrink: 0; }

  .chat-body { flex: 1; overflow-y: auto; padding: 28px 28px 12px; display: flex; flex-direction: column; gap: 20px; }
  .chat-body::-webkit-scrollbar { width: 4px; }
  .chat-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
  .empty-icon { width: 56px; height: 56px; border-radius: 16px; background: rgba(124,111,247,0.1); border: 1px solid rgba(124,111,247,0.2); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
  .empty-icon svg { width: 26px; height: 26px; }
  .empty-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 600; }
  .empty-sub { font-size: 14px; color: var(--text-muted); max-width: 360px; line-height: 1.6; }
  .suggestion-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; max-width: 650px; }
  .chip { padding: 8px 14px; border-radius: 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); font-size: 12.5px; color: var(--text-sub); cursor: pointer; transition: all 0.15s; }
  .chip:hover { background: rgba(124,111,247,0.15); border-color: rgba(124,111,247,0.35); color: var(--accent2); }

  .msg { display: flex; gap: 12px; }
  .msg.user { flex-direction: row-reverse; }

  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .msg.ai .msg-avatar { background: linear-gradient(135deg, #7c6ff7, #a78bfa); color: #fff; }
  .msg.user .msg-avatar { background: rgba(255,255,255,0.1); color: var(--text); }

  .msg-bubble { max-width: 75%; padding: 14px 18px; border-radius: 16px; font-size: 14.5px; line-height: 1.7; word-break: break-word; }
  .msg.ai .msg-bubble { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px 16px 16px 16px; }
  .msg.user .msg-bubble { background: linear-gradient(135deg, rgba(124,111,247,0.35), rgba(167,139,250,0.2)); border: 1px solid rgba(124,111,247,0.3); border-radius: 16px 4px 16px 16px; color: var(--text); }
  .msg-time { font-size: 10.5px; color: var(--text-muted); margin-top: 4px; }

  .typing-indicator { display: flex; gap: 4px; padding: 14px 16px; }
  .typing-indicator span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s ease-in-out infinite; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }

  .chat-input-area { padding: 16px 28px 22px; background: rgba(255,255,255,0.015); backdrop-filter: blur(10px); border-top: 1px solid var(--glass-border); }
  .input-box { display: flex; align-items: flex-end; gap: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px 14px; transition: border-color 0.2s, box-shadow 0.2s; }
  .input-box:focus-within { border-color: rgba(124,111,247,0.5); box-shadow: 0 0 0 3px rgba(124,111,247,0.1); }
  .input-box textarea { flex: 1; background: none; border: none; outline: none; resize: none; color: var(--text); font-family: inherit; font-size: 14.5px; line-height: 1.55; max-height: 140px; min-height: 24px; }
  .input-box textarea::placeholder { color: var(--text-muted); }
  .send-btn { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; background: linear-gradient(135deg, #7c6ff7, #a78bfa); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(124,111,247,0.35); }
  .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
  .send-btn svg { width: 16px; height: 16px; fill: #fff; }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<!-- ══ LOGIN ══ -->
<div class="auth-wrap" id="loginScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 14a6 6 0 110-12 6 6 0 010 12zm-1-9h2v4H9V7zm0 5h2v2H9v-2z"/></svg>
      </div>
      <span class="auth-logo-name">Campus AI</span>
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to continue your conversations</p>
    <div class="err-msg" id="loginErr"></div>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Your password" />
    </div>
    <button class="btn-primary" onclick="doLogin()">Sign in</button>
    <div class="auth-switch">Don't have an account? <a onclick="showRegister()">Create one</a></div>
  </div>
</div>

<!-- ══ REGISTER ══ -->
<div class="auth-wrap" id="registerScreen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 14a6 6 0 110-12 6 6 0 010 12zm-1-9h2v4H9V7zm0 5h2v2H9v-2z"/></svg>
      </div>
      <span class="auth-logo-name">Campus AI</span>
    </div>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-sub">Start chatting with Campus AI today</p>
    <div class="err-msg" id="regErr"></div>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="regEmail" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="regPass" placeholder="Min. 6 characters" />
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input type="password" id="regPass2" placeholder="Repeat password" />
    </div>
    <button class="btn-primary" onclick="doRegister()">Create account</button>
    <div class="auth-switch">Already have an account? <a onclick="showLogin()">Sign in</a></div>
  </div>
</div>

<!-- ══ APP SHELL ══ -->
<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">
        <svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 14a6 6 0 110-12 6 6 0 010 12zm-1-9h2v4H9V7zm0 5h2v2H9v-2z"/></svg>
      </div>
      <span class="sidebar-logo-name">Campus AI</span>
    </div>
    <button class="btn-new-chat" onclick="newChat()">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a.5.5 0 01.5.5v5.5H14a.5.5 0 010 1H8.5V14a.5.5 0 01-1 0V8.5H2a.5.5 0 010-1h5.5V2a.5.5 0 01.5-.5z"/></svg>
      New conversation
    </button>
    <div class="chats-label">Recent chats</div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">
      <div class="user-pill">
        <div class="user-avatar" id="userInitial">?</div>
        <div class="user-info">
          <div class="user-email" id="userEmail">—</div>
          <button class="logout-btn" onclick="doLogout()">Sign out</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="chat-main">
    <div class="chat-header">
      <div class="status-dot"></div>
      <div>
        <div class="chat-header-title">Campus AI</div>
        <div class="chat-header-sub">Polytechnic Helpdesk Assistant</div>
      </div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-area">
      <div class="input-box">
        <textarea id="msgInput" placeholder="Ask about departments, admissions, contacts…" rows="1" onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
        <button class="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 16 16"><path d="M2.1 1.4L14.6 7.1a1 1 0 010 1.8L2.1 14.6A1 1 0 01.8 13.3l1.8-5.3L.8 2.7A1 1 0 012.1 1.4z"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<script>
  let token = localStorage.getItem('campus_token');
  let currentUser = localStorage.getItem('campus_user');
  let activeChatId = null;

  window.addEventListener('DOMContentLoaded', () => {
    if (token && currentUser) enterApp();
  });

  function showLogin() {
    document.getElementById('registerScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }
  function showRegister() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('registerScreen').style.display = 'flex';
  }
  function showErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.style.display = 'block';
  }
  function clearErr(id) { document.getElementById(id).style.display = 'none'; }

  async function doLogin() {
    clearErr('loginErr');
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      token = data.token;
      currentUser = data.email;
      localStorage.setItem('campus_token', token);
      localStorage.setItem('campus_user', currentUser);
      enterApp();
    } catch (e) { showErr('loginErr', e.message); }
  }

  async function doRegister() {
    clearErr('regErr');
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPass').value;
    const confirm = document.getElementById('regPass2').value;
    if (password !== confirm) return showErr('regErr', 'Passwords do not match');

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      token = data.token;
      currentUser = data.email;
      localStorage.setItem('campus_token', token);
      localStorage.setItem('campus_user', currentUser);
      enterApp();
    } catch (e) { showErr('regErr', e.message); }
  }

  function doLogout() {
    token = null;
    currentUser = null;
    activeChatId = null;
    localStorage.removeItem('campus_token');
    localStorage.removeItem('campus_user');
    document.getElementById('app').classList.remove('visible');
    document.getElementById('loginScreen').style.display = 'flex';
  }

  async function enterApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('registerScreen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('userEmail').textContent = currentUser;
    document.getElementById('userInitial').textContent = currentUser[0].toUpperCase();
    await fetchChatList();
    if (!activeChatId) newChat();
  }

  async function fetchChatList() {
    const res = await fetch('/api/chats', { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.status === 401 || res.status === 403) return doLogout();
    const chats = await res.json();
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    if (!chats.length) {
      list.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:8px 6px">No chats yet</div>';
      return;
    }
    chats.forEach(chat => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (activeChatId === chat.id ? ' active' : '');
      item.innerHTML = `
        <span class="chat-item-text">${escHtml(chat.title)}</span>
        <div class="chat-item-del" onclick="deleteChat(event, ${chat.id})">
          <svg viewBox="0 0 12 12" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg>
        </div>`;
      item.addEventListener('click', () => loadChat(chat.id));
      list.appendChild(item);
    });
  }

  async function newChat() {
    const res = await fetch('/api/chats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ title: 'New conversation' })
    });
    const chat = await res.json();
    activeChatId = chat.id;
    await fetchChatList();
    loadChat(chat.id);
  }

  async function loadChat(id) {
    activeChatId = id;
    await fetchChatList();
    const res = await fetch(`/api/chats/${id}/messages`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const messages = await res.json();
    const body = document.getElementById('chatBody');
    body.innerHTML = '';

    if (!messages.length) {
      body.innerHTML = `
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg viewBox="0 0 26 26" fill="none">
              <circle cx="13" cy="13" r="11" stroke="#7c6ff7" stroke-width="1.5"/>
              <path d="M9 13c0-2.2 1.8-4 4-4s4 1.8 4 4-1.8 4-4 4" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="13" cy="17" r="1" fill="#a78bfa"/>
            </svg>
          </div>
          <div class="empty-title">Welcome to Campus AI</div>
          <div class="empty-sub">Explore our polytechnic departments, faculty contacts, admissions, and career options below:</div>
          <div class="suggestion-chips">
            <div class="chip" onclick="sendChip(this)">CSE Department Details</div>
            <div class="chip" onclick="sendChip(this)">EEE Department Details</div>
            <div class="chip" onclick="sendChip(this)">Civil Engineering Details</div>
            <div class="chip" onclick="sendChip(this)">Mechanical Department Details</div>
            <div class="chip" onclick="sendChip(this)">Papertech Department Details</div>
            <div class="chip" onclick="sendChip(this)">ICE Department Details</div>
            <div class="chip" onclick="sendChip(this)">Admission Eligibility</div>
            <div class="chip" onclick="sendChip(this)">Hostel & Mess Info</div>
            <div class="chip" onclick="sendChip(this)">Placement Statistics</div>
          </div>
        </div>`;
      return;
    }
    messages.forEach(m => addBubble(m.role, m.text, m.time, false));
    scrollBottom();
  }

  async function deleteChat(e, id) {
    e.stopPropagation();
    await fetch(`/api/chats/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (activeChatId === id) newChat();
    else fetchChatList();
  }

  async function sendMessage() {
    const ta = document.getElementById('msgInput');
    const text = ta.value.trim();
    if (!text || !activeChatId) return;

    ta.value = '';
    ta.style.height = '24px';
    const userTime = now();
    addBubble('user', text, userTime);
    showTyping();

    try {
      const res = await fetch(`/api/chats/${activeChatId}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ text, time: userTime })
      });
      const data = await res.json();
      removeTyping();
      addBubble('ai', data.text, data.time);
      fetchChatList();
    } catch (e) {
      removeTyping();
      addBubble('ai', 'Error connecting to the server.', now());
    }
  }

  // Parses markdown bold (**text**) and line breaks cleanly
  function formatMarkdown(text) {
    const safeText = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const formatted = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    return formatted.replace(/\n/g, '<br>');
  }

  function addBubble(role, text, time) {
    const body = document.getElementById('chatBody');
    const es = document.getElementById('emptyState');
    if (es) es.remove();
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    
    const contentHtml = role === 'ai' ? formatMarkdown(text) : escHtml(text);

    div.innerHTML = `
      <div class="msg-avatar">${role === 'ai' ? '✦' : currentUser[0].toUpperCase()}</div>
      <div>
        <div class="msg-bubble">${contentHtml}</div>
        <div class="msg-time">${time}</div>
      </div>`;
    body.appendChild(div);
    scrollBottom();
  }

  function showTyping() {
    const body = document.getElementById('chatBody');
    const d = document.createElement('div');
    d.className = 'msg ai';
    d.id = 'typing';
    d.innerHTML = `<div class="msg-avatar">✦</div><div class="msg-bubble" style="padding:0"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
    body.appendChild(d);
    scrollBottom();
  }

  function removeTyping() {
    document.getElementById('typing')?.remove();
  }

  function scrollBottom() {
    const b = document.getElementById('chatBody');
    b.scrollTop = b.scrollHeight;
  }

  function escHtml(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoGrow(el) {
    el.style.height = '24px';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function sendChip(el) {
    document.getElementById('msgInput').value = el.textContent;
    sendMessage();
  }
</script>
</body>
</html>
